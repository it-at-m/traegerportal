logging:
  include-application-group: false # disabled because application group is only relevant when deployed
  structured:
    format:
      console: # set to empty to disable structured logging for testing

wiremock:
  server:
    port: 0
    https-port: -1

resourceserver:
  client-access-rules:
    - path-matchers: /clients/egovfor-validierungs-eai/**
      client-id: max.mustermann
      jwt:
        issuer-uri: "http://example.test"
        jwk-set-uri: "http://example.test"

adapter:
  fallbearbeitung:
    base-url: http://localhost:${wiremock.server.port}
    path-prefix: /external
  einrichtungsverwaltung:
    base-url: http://localhost:${wiremock.server.port}
    path-prefix: /external
