server:
  port: 8083

resourceserver:
  main:
    user-info: http://keycloak:8100/auth/realms/local_realm/protocol/openid-connect/userinfo
    issuer-uri: http://keycloak:8100/auth/realms/local_realm
    jwk-set-uri: http://keycloak:8100/auth/realms/local_realm/protocol/openid-connect/certs
  client-access-rules:
    - path-matchers: /clients/egovfor-validierungs-eai/**
      client-id: egovfor-validierungs-eai
      jwt:
        issuer-uri: http://keycloak:8100/auth/realms/local_realm
        jwk-set-uri: http://keycloak:8100/auth/realms/local_realm/protocol/openid-connect/certs

adapter:
  fallbearbeitung:
    base-url: http://localhost:8084
    prefix-path: /external
  einrichtungsverwaltung:
    base-url: http://localhost:8080
    prefix-path: /external
  security:
    token-url: https://ssodev.muenchen.de/auth/realms/A23/protocol/openid-connect/token
    client-id: traegerportal-eai
    client-secret: # add when running
    scope: lhm-core openid
  webcomponents:
    base-url: http://localhost:8443

logging:
  # disabled because application group is only relevant when deployed
  include-application-group: false
  structured:
    format:
      console:
  level:
    root: INFO
    de.muenchen.refarch: DEBUG
    org.springframework.web: DEBUG
    org.springframework.cloud.gateway: TRACE
    org.springframework.security: DEBUG
