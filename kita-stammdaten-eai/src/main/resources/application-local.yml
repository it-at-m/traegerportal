server:
  port: 8083

resourceserver:
  sso:
    base-url: http://keycloak:8100
    realm: local_realm

adapter:
  fallbearbeitung:
    base-url: http://localhost:8084
    base-path: /external/traeger/(id)/vorgaenge
  einrichtungsverwaltung:
    base-url: http://localhost:8080
    base-path: /external/traeger/(id)
    id-path: /external/traeger/by-unternehmenskontoid/{ukid}/id
  security:
    token-url: https://ssodev.muenchen.de/auth/realms/A23/protocol/openid-connect/token
    client-id: traegerportal-eai
    client-secret: # add when running
    scope: lhm-core openid
    cache-expires-after-write: PT280S
  webcomponents:
    base-url: http://localhost:8443

logging:
  include-application-group: false # disabled because application group is only relevant when deployed
  structured:
    format:
      console:
  level:
    root: INFO
    de.muenchen.refarch: DEBUG
    org.springframework.web: DEBUG
    org.springframework.cloud.gateway: TRACE
    org.springframework.security: DEBUG
