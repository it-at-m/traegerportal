spring:
  application:
    name: "@project.artifactId@"
    group: "@project.groupId@"
    version: "@project.version@"
  main:
    web-application-type: reactive
    banner-mode: console
  web:
    error:
      include-message: always
      whitelabel:
        enabled: false
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - https://stadt-i.muenchen.de
                allowedMethods:
                  - GET
                  - POST
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true
          routes:

            - id: userinfo
              uri: ${resourceserver.main.user-info}
              predicates:
                - Path=/api/sso/userinfo
                - Method=GET
              filters:
                - name: SetRequestUri

            - id: webcomponents
              uri: ${adapter.webcomponents.base-url}
              predicates:
                - Path=/webcomponents/**
                - Method=GET
              filters:
                - StripPrefix=1

            - id: meintraeger
              uri: ${adapter.einrichtungsverwaltung.base-url}
              predicates:
                - Path=/meintraeger/**
                - Method=GET
              filters:
                - name: RewritePathWithTraegerIdFromJwt
                  args:
                    claimsToForwardAsHeaders: preferred_username
                    pathPrefixToReplace: /meintraeger
                    targetPathTemplateByJwtClaim: /traeger/{datenuebermittlerPseudonymId}
                - name: RemoveRequestHeader
                  args:
                    name: Origin
                - name: ReplaceAuthorizationWithStammdatenToken
                - name: PrefixPath
                  args:
                    prefix: ${adapter.einrichtungsverwaltung.prefix-path}

            - id: meinevorgaenge
              uri: ${adapter.fallbearbeitung.base-url}
              predicates:
                - Path=/meinevorgaenge/**
                - Method=GET
              filters:
                - name: RewritePathWithTraegerIdFromJwt
                  args:
                    claimsToForwardAsHeaders: preferred_username
                    pathPrefixToReplace: /meinevorgaenge
                    targetPathTemplateByJwtClaim: /traeger/{datenuebermittlerPseudonymId}/vorgaenge
                - name: RemoveRequestHeader
                  args:
                    name: Origin
                - name: ReplaceAuthorizationWithStammdatenToken
                - name: PrefixPath
                  args:
                    prefix: ${adapter.fallbearbeitung.prefix-path}

            - id: egovfor-traeger
              uri: ${adapter.einrichtungsverwaltung.base-url}
              predicates:
                - Path=/clients/egovfor-validierungs-eai/search/traeger
                - Method=GET
              filters:
                - name: RewriteQueryParamWithTraegerId
                  args:
                    sourceQueryParam: unternehmenskontoId
                    targetQueryParam: traegerId
                - name: RewriteQueryParamsToPath
                  args:
                    targetPath: /traeger/{traegerId}
                - name: RemoveRequestHeader
                  args:
                    name: Origin
                - name: ReplaceAuthorizationWithStammdatenToken
                - name: PrefixPath
                  args:
                    prefix: ${adapter.einrichtungsverwaltung.prefix-path}

            - id: egovfor-einrichtung
              uri: ${adapter.einrichtungsverwaltung.base-url}
              predicates:
                - Path=/clients/egovfor-validierungs-eai/search/einrichtung
                - Method=GET
              filters:
                - name: RewriteQueryParamWithTraegerId
                  args:
                    sourceQueryParam: unternehmenskontoId
                    targetQueryParam: traegerId
                - name: RewriteQueryParamsToPath
                  args:
                    targetPath: /traeger/{traegerId}/einrichtungen/{einrichtungId}
                - name: RemoveRequestHeader
                  args:
                    name: Origin
                - name: ReplaceAuthorizationWithStammdatenToken
                - name: PrefixPath
                  args:
                    prefix: ${adapter.einrichtungsverwaltung.prefix-path}

            - id: egovfor-ansprechpartner
              uri: ${adapter.einrichtungsverwaltung.base-url}
              predicates:
                - Path=/clients/egovfor-validierungs-eai/search/ansprechpartner
                - Method=GET
              filters:
                - name: RewriteQueryParamWithTraegerId
                  args:
                    sourceQueryParam: unternehmenskontoId
                    targetQueryParam: traegerId
                - name: RewriteQueryParamsToPath
                  args:
                    targetPath: /traeger/{traegerId}/ansprechpartner/{ansprechpartnerId}
                - name: RemoveRequestHeader
                  args:
                    name: Origin
                - name: ReplaceAuthorizationWithStammdatenToken
                - name: PrefixPath
                  args:
                    prefix: ${adapter.einrichtungsverwaltung.prefix-path}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${resourceserver.main.issuer-uri}
          jwk-set-uri: ${resourceserver.main.jwk-set-uri}

resourceserver:
  main:
    user-info: https://sso.muenchen.de/auth/realms/public/protocol/openid-connect/userinfo
    issuer-uri: https://sso.muenchen.de/auth/realms/public
    jwk-set-uri: https://sso.muenchen.de/auth/realms/public/protocol/openid-connect/certs
    security-matcher:
      path-matchers: /meintraeger/**, /meinevorgaenge/**
  client-access-rules:
    - path-matchers: /clients/egovfor-validierungs-eai/**
      client-id: example-client
      jwt:
        issuer-uri: https://ssotest.muenchen.de/auth/realms/intrap
        jwk-set-uri: https://ssotest.muenchen.de/auth/realms/intrap/protocol/openid-connect/certs

adapter:
  fallbearbeitung:
    base-url: https://kita-fallbearbeitung.muenchen.de
    prefix-path: /api/fallbearbeitung-backend/external
  einrichtungsverwaltung:
    base-url: https://kita-einrichtung.muenchen.de
    prefix-path: /api/einrichtungsverwaltung-backend/external
    id-resolver:
      path: ${adapter.einrichtungsverwaltung.prefix-path}/traeger/by-unternehmenskontoid/{unternehmenskontoId}/id
      cache-expires-after-write: PT10M
      cache-maximum-size: 1000
  security:
    token-url: https://sso.muenchen.de/auth/realms/muenchen.de/protocol/openid-connect/token
    client-id: example-client
    client-secret: example-secret
    scope: lhm-core openid
    cache-expires-after-write: PT1M
    cache-maximum-size: 1
  webcomponents:
    base-url: https://kita-traegerportal-webcomponents-test.muenchen.de

management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include:
          - health
          - info
          - prometheus
          - sbom
      path-mapping:
        prometheus: metrics
  endpoint:
    health:
      access: READ_ONLY
      probes:
        enabled: true
    info:
      access: READ_ONLY
    prometheus:
      access: READ_ONLY
    sbom:
      access: READ_ONLY
  info:
    env:
      enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    root: info
    de:
      muenchen:
        rbs:
          traegerportal: debug
  structured:
    format:
      console: logstash
    json:
      stacktrace:
        root: first
        # default max size of one log line in docker is 16kb - UTF8 ~ 1 Character = 1 Byte
        # therefore limit stack traces to a maximum of 8192 characters (to leave room for the rest of the message)
        max-length: 8192
      add:
        application_name: ${spring.application.name}
        application_group: ${spring.application.group}

info:
  application:
    name: ${spring.application.name}
    version: ${spring.application.version}
    group: ${spring.application.group}
    description: "@project.description@"
  build:
    java.version: "@java.version@"
    spring-cloud.version: "@spring-cloud-dependencies.version@"

config:
  map5xxto400: true
