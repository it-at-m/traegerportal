spring:
  application:
    name: "@project.artifactId@"
    group: "@project.groupId@"
    version: "@project.version@"
  main:
    web-application-type: reactive
    banner-mode: console
  web:
    error:
      include-message: always
      whitelabel:
        enabled: false
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - https://stadt-i.muenchen.de
                allowedMethods:
                  - GET
                  - POST
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true
          routes:

            - id: sso
              uri: ${resourceserver.sso.base-url}
              predicates:
                - Path=/api/sso/userinfo
              filters:
                - name: RewritePath
                  args:
                    regexp: '/api/sso/userinfo'
                    replacement: '/auth/realms/local_realm/protocol/openid-connect/userinfo'

            - id: meintraeger
              uri: ${adapter.einrichtungsverwaltung.base-url}
              predicates:
                - Path=/meintraeger,/meintraeger/**
                - Method=GET
              filters:
                - name: RewritePath
                  args:
                    regexp: '^/meintraeger'
                    replacement: '${adapter.einrichtungsverwaltung.base-path}'
                - RemoveRequestHeader=Origin
                - name: StammdatenSecurity

            - id: meinevorgaenge
              uri: ${adapter.fallbearbeitung.base-url}
              predicates:
                - Path=/meinevorgaenge,/meinevorgaenge/**
                - Method=GET
              filters:
                - name: RewritePath
                  args:
                    regexp: '^/meinevorgaenge'
                    replacement: '${adapter.fallbearbeitung.base-path}'
                - RemoveRequestHeader=Origin
                - name: StammdatenSecurity

            - id: webcomponents
              uri: ${adapter.webcomponents.base-url}
              predicates:
                - Path=/webcomponents/**
                - Method=GET
              filters:
                - StripPrefix=1

            - id: eogovfor-traeger
              uri: ${adapter.einrichtungsverwaltung.base-url}
              predicates:
                - Path=clients/egovfor-validierungs-eai/search/traeger
                - Method=GET
              filters:
                - RemoveRequestHeader=Origin
                - name: QueryParamsToPath
                  args:
                    targetPath: '${adapter.einrichtungsverwaltung.base-path}/{traegerId}'
                - name: StammdatenSecurity

            - id: eogovfor-einrichtung
              uri: ${adapter.einrichtungsverwaltung.base-url}
              predicates:
                - Path=clients/egovfor-validierungs-eai/search/einrichtung
                - Method=GET
              filters:
                - RemoveRequestHeader=Origin
                - name: QueryParamsToPath
                  args:
                    targetPath: '${adapter.einrichtungsverwaltung.base-path}/{traegerId}/einrichtung/{einrichtungId}'
                - name: StammdatenSecurity

            - id: eogovfor-ansprechpartner
              uri: ${adapter.einrichtungsverwaltung.base-url}
              predicates:
                - Path=clients/egovfor-validierungs-eai/search/ansprechpartner
                - Method=GET
              filters:
                - RemoveRequestHeader=Origin
                - name: QueryParamsToPath
                  args:
                    targetPath: '${adapter.einrichtungsverwaltung.base-path}/{traegerId}/ansprechpartner/{ansprechpartnerId}'
                - name: StammdatenSecurity
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${resourceserver.sso.base-url}/auth/realms/${resourceserver.sso.realm}
          jwk-set-uri: ${resourceserver.sso.base-url}/auth/realms/${resourceserver.sso.realm}/protocol/openid-connect/certs

resourceserver:
  sso:
    base-url: https://sso.muenchen.de
    realm: public
  client-access-rules:
    - path-pattern: /clients/example-client/**
      client-id: example-client

adapter:
  fallbearbeitung:
    base-url: https://kita-fallbearbeitung.muenchen.de
    base-path: /api/fallbearbeitung-backend/external/traeger/(id)/vorgaenge
  einrichtungsverwaltung:
    base-url: https://kita-einrichtung.muenchen.de
    base-path: /api/einrichtungsverwaltung-backend/external/traeger/(id)
    id-path: /api/einrichtungsverwaltung-backend/external/traeger/by-unternehmenskontoid/{ukid}/id
    cache-expires-after-write: PT600S
    cache-maximum-size: 1000
  security:
    token-url: https://sso.muenchen.de/auth/realms/muenchen.de/protocol/openid-connect/token
    client-id: rbseinr-traegerportal
    client-secret: client_secret
    scope: LHM_Extended
    cache-expires-after-write: PT60S
    cache-maximum-size: 1000
  webcomponents:
    base-url: https://kita-traegerportal-webcomponents-test.muenchen.de

management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include:
          - health
          - info
          - prometheus
          - sbom
      path-mapping:
        prometheus: metrics
  endpoint:
    health:
      access: READ_ONLY
      probes:
        enabled: true
    info:
      access: READ_ONLY
    prometheus:
      access: READ_ONLY
    sbom:
      access: READ_ONLY
  info:
    env:
      enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    root: info
    de:
      muenchen:
        rbs:
          traegerportal: debug
  structured:
    format:
      console: logstash
    json:
      stacktrace:
        root: first
        # default max size of one log line in docker is 16kb - UTF8 ~ 1 Character = 1 Byte
        # therefore limit stack traces to a maximum of 8192 characters (to leave room for the rest of the message)
        max-length: 8192
      add:
        application_name: ${spring.application.name}
        application_group: ${spring.application.group}

info:
  application:
    name: ${spring.application.name}
    version: ${spring.application.version}
    group: ${spring.application.group}
    description: "@project.description@"
  build:
    java.version: "@java.version@"
    spring-cloud.version: "@spring-cloud-dependencies.version@"

config:
  map5xxto400: true
