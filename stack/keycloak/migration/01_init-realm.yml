id: init realm
author: Default
changes:
  - addRealm:
      name: local_realm

  - addRealmProfileAttribute:
      realm: local_realm
      name: datenuebermittlerPseudonymId
      displayName: datenuebermittlerPseudonymId
      permissions:
        view:
          - admin
          - user
        edit:
          - admin
      required:
        roles:
          - admin
          - user

  - addClientScope:
      realm: local_realm
      name: openid
      description: Client scope used for OpenID Connect (OIDC) based authentication
